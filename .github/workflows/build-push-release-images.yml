name: build-push-release-images
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A release tag normally points at a commit that already passed go-checks on a
  # branch push, so reuse that run instead of testing the same tree twice. The
  # tag and the branch are often pushed together, so this waits for the run to
  # appear and finish before deciding. If the commit has no branch run at all
  # (e.g. an old tag), the same checks are run here.
  verify:
    name: verify go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Reuse the go-checks run for this commit when there is one
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "commit: ${sha}"

          started=$SECONDS
          # Long enough for the run created by a simultaneous branch push to show up.
          appearance_deadline=$((started + 60))
          # Upper bound on waiting for that run to finish.
          completion_deadline=$((started + 300))

          while true; do
            if ! runs=$(gh api "repos/${REPO}/actions/workflows/go-checks.yml/runs?head_sha=${sha}&per_page=50" 2>/dev/null); then
              echo "::warning::cannot read go-checks runs for ${sha}; running the checks here"
              break
            fi

            # Only branch pushes count: a pull_request run for the same SHA says
            # nothing about the state of the branch the tag was cut from.
            success=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.event == "push" and .status == "completed" and .conclusion == "success")] | length')
            failed=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.event == "push" and .status == "completed" and .conclusion == "failure")] | length')
            pending=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.event == "push" and .status != "completed")] | length')
            total=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.event == "push")] | length')

            if [ "$success" -gt 0 ]; then
              echo "go-checks already passed for ${sha}; skipping the local run"
              echo "reused=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A pending re-run outranks an older failure, so only fail fast when
            # nothing else is in flight.
            if [ "$failed" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "::error::go-checks failed for ${sha}; fix the branch before tagging"
              exit 1
            fi
            if [ "$pending" -gt 0 ] && [ "$SECONDS" -lt "$completion_deadline" ]; then
              echo "waiting for go-checks on ${sha} to finish"
              sleep 10
              continue
            fi
            # Only wait for a run to appear when none exists yet; a completed but
            # inconclusive run will not become a success by waiting.
            if [ "$total" -eq 0 ] && [ "$SECONDS" -lt "$appearance_deadline" ]; then
              echo "waiting for a go-checks run for ${sha}"
              sleep 5
              continue
            fi
            break
          done

          echo "no completed go-checks run for ${sha}; running the checks here"
          echo "reused=false" >> "$GITHUB_OUTPUT"

      # Shared with .github/workflows/go-checks.yml, and only run when this
      # commit has no green run there to reuse.
      - name: Run Go checks
        if: steps.gate.outputs.reused != 'true'
        uses: ./.github/actions/go-checks

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install cosign
        if: github.event_name != 'pull_request'
        # Pinned to a full version: unlike the other actions here, sigstore
        # publishes no floating `v4` major tag (only `v4.x.y`).
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.4'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver, not raw refs: the tag is vX.Y.Z and the published tags drop the v.
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64, linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
